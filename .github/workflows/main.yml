name: 数据库
on:
  schedule:
    - cron: '0 7 * * *'  # UTC 07:00 = UTC+8 15:00
  workflow_dispatch:      # 支持手动触发

jobs:
  generate-csv:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # 必须赋予写入权限

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # 获取完整提交历史

      # 2. 设置Python环境
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'    # 启用pip缓存

      # 3. 缓存整个Python环境
      - name: Cache Python environment
        uses: actions/cache@v5
        id: cache-python
        with:
          path: |
            ~/.cache/pip
            /opt/hostedtoolcache/Python/3.11*/x64/lib/python3.11/site-packages
          key: ${{ runner.os }}-python-${{ hashFiles('requirements.txt') }}-${{ hashFiles('main.py') }}
          restore-keys: |
            ${{ runner.os }}-python-

      # 4. 安装依赖（仅在缓存未命中时执行）
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          else
            echo "⚠️  requirements.txt 文件不存在，跳过依赖安装"
          fi

      # 5. 创建datasets目录
      - name: Create datasets folder
        run: mkdir -p datasets

      # 6. 计算两天前的日期
      - name: Calculate date minus 2 days
        id: date_calc
        run: |
          # 计算两天前的日期（UTC时间）
          MINUS_TWO_DAYS=$(date -u -d "-2 days" +'%Y%m%d')
          echo "MINUS_TWO_DAYS=$MINUS_TWO_DAYS" >> $GITHUB_OUTPUT
          echo "预计文件名: datasets/${MINUS_TWO_DAYS}.csv"

      # 7. 运行main.py脚本
      - name: Run main.py
        run: python main.py

      # 8. 配置Git用户信息
      - name: Setup Git config
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # 9. 自动提交生成的CSV文件到datasets目录
      - name: Commit and push CSV file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 检查datasets目录是否存在且包含CSV文件
          if [ -d "datasets" ] && [ "$(ls -A datasets/*.csv 2>/dev/null)" ]; then
            # 添加所有CSV文件
            git add datasets/*.csv
            
            # 检查是否有要提交的更改
            if git diff --cached --quiet; then
              echo "⚠️ 没有新的CSV文件需要提交"
            else
              # 获取提交的文件列表作为提交信息
              COMMIT_FILES=$(git diff --cached --name-only | xargs -I {} basename {} | tr '\n' ', ' | sed 's/,$//')
              git commit -m "Auto-Update: $COMMIT_FILES"
              git push https://$GH_TOKEN@github.com/${{ github.repository }}.git main
              echo "✅ CSV文件已提交"
              
              # 显示提交的文件列表
              echo "提交的文件:"
              git diff --cached --name-only
              
              # 显示第一个文件的前5行作为预览
              FIRST_FILE=$(git diff --cached --name-only | head -n 1)
              if [ -n "$FIRST_FILE" ]; then
                echo "文件内容预览 ($FIRST_FILE):"
                head -n 5 "$FIRST_FILE"
              fi
            fi
          else
            echo "❌ 没有找到CSV文件"
            echo "检查main.py是否正确输出到datasets/目录"
            echo "当前目录内容:"
            ls -la
            echo "datasets目录内容:"
            ls -la datasets/ 2>/dev/null || echo "datasets目录不存在"
            exit 1
          fi

      # 10. 调试信息（可选）
      - name: Debug information
        if: always()
        run: |
          echo "工作流执行状态: ${{ job.status }}"
          echo "缓存命中状态: ${{ steps.cache-python.outputs.cache-hit }}"
          echo "datasets目录中的CSV文件:"
          ls -la datasets/*.csv 2>/dev/null || echo "没有找到CSV文件"
          echo "所有生成的CSV文件:"
          find . -name "*.csv" -type f
